name: Cowboy Space Corporation
description: 'Cowboy Space Corporation is a space infrastructure company building orbital
  data centers to address Earth''s power constraints on artificial intelligence. Its
  Stampede satellite constellation places megawatt-class, GPU-equipped data centers
  in Low Earth Orbit powered by abundant solar energy, integrating the compute payload
  directly into the rocket''s upper stage to maximize capacity and sidestep the multi-year
  terrestrial grid-connection delays that constrain traditional data centers. The
  company is an early-stage, venture-backed lead (backed by IVP); it currently
  publishes a corporate marketing site and careers portal but no developer portal,
  public API, or technical documentation.'
